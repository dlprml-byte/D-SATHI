<script>
async function loadNepalNews() {
    const box = document.getElementById("news-list");

    box.innerHTML = "समाचार लोड हुँदैछ...";

    const feed = "https://news.google.com/rss?hl=ne&gl=NP&ceid=NP:ne";

    try {
        const api = "https://api.rss2json.com/v1/api.json?rss_url="
                    + encodeURIComponent(feed);

        const response = await fetch(api);

        if (!response.ok) {
            throw new Error("API Error");
        }

        const data = await response.json();

        if (data.status !== "ok" || !data.items || data.items.length === 0) {
            throw new Error("News unavailable");
        }

        box.innerHTML = data.items.slice(0, 15).map(item => `
            <article>
                <h3>${item.title}</h3>
                <p>${item.pubDate || ""}</p>
                <a href="${item.link}" target="_blank">
                    पूरा समाचार पढ्नुहोस् →
                </a>
            </article>
        `).join("");

    } catch (error) {
        box.innerHTML = `
            <p>समाचार लोड हुन सकेन।</p>
            <button onclick="loadNepalNews()">🔄 फेरि प्रयास गर्नुहोस्</button>
        `;
    }
}

loadNepalNews();
</script>
