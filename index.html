<!DOCTYPE html>
<html lang="ne">
<head <link rel="manifest" href="/D-SATHI/manifest.json">
<meta name="theme-color" content="#d71920">

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/D-SATHI/service-worker.js");
  });
}
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D SATHI</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  text-align: center;
}
header {
  background: #d71920;
  color: white;
  padding: 25px;
}
h1 { margin: 0; }
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
  padding: 20px;
}
.card {
  background: white;
  padding: 25px 10px;
  border-radius: 12px;
  font-size: 18px;
  box-shadow: 0 2px 6px #ccc;
}
footer { padding: 20px; color: #555; }
</style>
</head>
<body>
<header>
<h1>🇳🇵 D SATHI</h1>
<p>All in One Nepal App</p>
</header>
<div class="grid">
<div class="card">📅 नेपाली पात्रो</div>
<div class="card">📰 समाचार</div>
<div class="card">🏥 स्वास्थ्य</div>
<div class="card">👨‍⚕️ Online Doctor</div>
<div class="card">🎬 Short Videos</div>
<div class="card">💬 Chat</div>
<div class="card">🎮 Games</div>
<div class="card">🌤️ मौसम</div>
<div class="card">📈 Share Market</div>
<div class="card">👤 Profile</div>
</div>
<footer>
Developed by Dilip Rimal
</footer>
</body>
</html>
